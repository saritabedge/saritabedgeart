        <ellipse cx="26" cy="0" rx="24" ry="17" transform="rotate(90)"/>
        <ellipse cx="18" cy="20" rx="24" ry="17" transform="rotate(135)"/>
        <ellipse cx="0" cy="26" rx="24" ry="17" transform="rotate(180)"/>
        <ellipse cx="-18" cy="18" rx="24" ry="17" transform="rotate(225)"/>
        <ellipse cx="-26" cy="0" rx="24" ry="17" transform="rotate(270)"/>
        <ellipse cx="-18" cy="-18" rx="24" ry="17" transform="rotate(315)"/>
