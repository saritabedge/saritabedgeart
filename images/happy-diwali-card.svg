        <ellipse cx="0" cy="-28" rx="26" ry="19" transform="rotate(0)"/>
        <ellipse cx="20" cy="-18" rx="26" ry="19" transform="rotate(45)"/>
        <ellipse cx="28" cy="0" rx="26" ry="19" transform="rotate(90)"/>
        <ellipse cx="18" cy="20" rx="26" ry="19" transform="rotate(135)"/>
        <ellipse cx="0" cy="28" rx="26" ry="19" transform="rotate(180)"/>
        <ellipse cx="-18" cy="18" rx="26" ry="19" transform="rotate(225)"/>
        <ellipse cx="-28" cy="0" rx="26" ry="19" transform="rotate(270)"/>
        <ellipse cx="-18" cy="-18" rx="26" ry="19" transform="rotate(315)"/>
      </g>
      <g class="flower-purple" transform="translate(905 255) scale(1.15)">
