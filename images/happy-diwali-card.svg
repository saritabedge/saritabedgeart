<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Happy Diwali</title>
  <desc id="desc">Decorative Diwali card with a golden oval background, floral wreath, and candles.</desc>
  <defs>
    <style>
      .bg { fill: #e2c77d; }
      .outline { stroke: #1f1f1f; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .leaf { fill: #3d8a3d; stroke: #1f1f1f; stroke-width: 6; }
      .flower-pink { fill: #f7a1dd; stroke: #1f1f1f; stroke-width: 6; }
      .flower-purple { fill: #b781f5; stroke: #1f1f1f; stroke-width: 6; }
      .flower-red { fill: #ff3d2e; stroke: #1f1f1f; stroke-width: 6; }
      .flame { fill: #ffeb7a; stroke: #1f1f1f; stroke-width: 4; }
      .candle { fill: #d38d33; stroke: #1f1f1f; stroke-width: 6; }
      .text-big { font-family: 'Segoe Print', 'Bradley Hand', cursive; font-weight: 700; font-size: 200px; fill: #1d1d1d; }
      .text-small { font-family: 'Segoe Print', 'Bradley Hand', cursive; font-size: 72px; fill: #1d1d1d; font-style: italic; }
    </style>
  </defs>

  <rect width="1200" height="1200" fill="#f5f0d0"/>

  <g transform="translate(120 120)">
    <ellipse class="bg outline" cx="480" cy="480" rx="470" ry="465"/>

    <g opacity="0.95">
      <path class="leaf" d="M95 275 C140 230, 225 205, 260 245 C210 285, 150 330, 95 275 Z"/>
      <path class="leaf" d="M155 125 C205 110, 260 150, 280 192 C220 205, 170 175, 155 125 Z"/>
      <path class="leaf" d="M985 280 C940 235, 855 208, 820 250 C870 290, 930 330, 985 280 Z"/>
      <path class="leaf" d="M1045 120 C995 108, 940 150, 920 190 C980 208, 1035 178, 1045 120 Z"/>
      <path class="leaf" d="M118 810 C160 770, 240 745, 285 785 C228 825, 170 860, 118 810 Z"/>
      <path class="leaf" d="M90 980 C130 930, 205 920, 252 960 C222 1010, 170 1060, 90 980 Z"/>
      <path class="leaf" d="M1060 810 C1018 772, 938 742, 892 785 C950 824, 1008 860, 1060 810 Z"/>
      <path class="leaf" d="M1100 980 C1060 930, 980 915, 930 955 C970 1015, 1030 1060, 1100 980 Z"/>
    </g>

    <g>
