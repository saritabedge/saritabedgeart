      <path class="flame" d="M0 0 C24 28, 20 64, 0 86 C-18 65, -20 28, 0 0 Z"/>
      <path class="flame" d="M0 15 C12 31, 12 50, 0 62 C-12 49, -12 28, 0 15 Z" opacity="0.7"/>
